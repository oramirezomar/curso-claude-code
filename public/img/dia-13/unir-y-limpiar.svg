<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Cerrar el trabajo paralelo, en orden</text>
  <rect x="20" y="56" width="140" height="130" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="90" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">1. Commit</text>
  <text x="90" y="106" text-anchor="middle" font-size="12" fill="#4d2011">En cada rama,</text>
  <text x="90" y="124" text-anchor="middle" font-size="12" fill="#4d2011">con un mensaje</text>
  <text x="90" y="142" text-anchor="middle" font-size="12" fill="#4d2011">que lo describa</text>
  <text x="90" y="168" text-anchor="middle" font-size="11" fill="#7c2f16">Sin commit, nada se une</text>
  <rect x="176" y="56" width="140" height="130" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="246" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">2. Unir</text>
  <text x="246" y="106" text-anchor="middle" font-size="12" fill="#4d2011">Desde la rama de</text>
  <text x="246" y="124" text-anchor="middle" font-size="12" fill="#4d2011">integración, una a</text>
  <text x="246" y="142" text-anchor="middle" font-size="12" fill="#4d2011">una con git merge</text>
  <text x="246" y="168" text-anchor="middle" font-size="11" fill="#7c2f16">Resuelve los conflictos</text>
  <rect x="332" y="56" width="140" height="130" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="402" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">3. Comprobar</text>
  <text x="402" y="106" text-anchor="middle" font-size="12" fill="#4d2011">node --check y</text>
  <text x="402" y="124" text-anchor="middle" font-size="12" fill="#4d2011">probar las tres</text>
  <text x="402" y="142" text-anchor="middle" font-size="12" fill="#4d2011">funciones juntas</text>
  <text x="402" y="168" text-anchor="middle" font-size="11" fill="#7c2f16">Antes de borrar nada</text>
  <rect x="488" y="56" width="140" height="130" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="558" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">4. Quitar worktrees</text>
  <text x="558" y="106" text-anchor="middle" font-size="12" fill="#4d2011" font-family="Menlo, Courier, monospace">git worktree</text>
  <text x="558" y="124" text-anchor="middle" font-size="12" fill="#4d2011" font-family="Menlo, Courier, monospace">remove ruta</text>
  <text x="558" y="168" text-anchor="middle" font-size="11" fill="#7c2f16">Antes que las ramas</text>
  <rect x="644" y="56" width="136" height="130" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="712" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">5. Borrar ramas</text>
  <text x="712" y="106" text-anchor="middle" font-size="12" fill="#4d2011" font-family="Menlo, Courier, monospace">git branch -d</text>
  <text x="712" y="124" text-anchor="middle" font-size="12" fill="#4d2011" font-family="Menlo, Courier, monospace">nombre</text>
  <text x="712" y="168" text-anchor="middle" font-size="11" fill="#7c2f16">Solo si ya se fusionó</text>
  <path d="M162 121 L172 121" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M318 121 L328 121" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M474 121 L484 121" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M630 121 L640 121" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="210" width="370" height="172" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="236" font-size="13" font-weight="700" fill="#7c2f16">El orden importa</text>
  <text x="40" y="262" font-size="12" fill="#4d2011">• Un worktree con cambios sin confirmar no se quita</text>
  <text x="52" y="280" font-size="12" fill="#4d2011">sin --force: Git te protege.</text>
  <text x="40" y="304" font-size="12" fill="#4d2011">• Una rama que sigue en un worktree no se borra.</text>
  <text x="40" y="328" font-size="12" fill="#4d2011">• Una rama sin fusionar no se borra con -d.</text>
  <text x="40" y="360" font-size="11" fill="#7c2f16">La carpeta .trees puede quedar vacía: puedes borrarla.</text>
  <rect x="410" y="210" width="370" height="172" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="430" y="236" font-size="13" font-weight="700" fill="#7c2f16">Después</text>
  <text x="430" y="262" font-size="12" fill="#4d2011">• Haz el commit final de la unión si aún falta.</text>
  <text x="430" y="286" font-size="12" fill="#4d2011">• Lleva la rama de integración a main con un pull</text>
  <text x="442" y="304" font-size="12" fill="#4d2011">request o una fusión.</text>
  <text x="430" y="328" font-size="12" fill="#4d2011">• Si algo no te gusta, ajústalo en la rama de</text>
  <text x="442" y="346" font-size="12" fill="#4d2011">integración con un solo Claude.</text>
</svg>
