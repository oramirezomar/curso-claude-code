<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Una función nueva, en su propia rama</text>

  <text x="24" y="86" font-size="13" font-weight="700" fill="#2e7d32">main</text>
  <path d="M70 82 L760 82" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="110" cy="82" r="9" fill="#2e7d32"/>
  <circle cx="660" cy="82" r="9" fill="#2e7d32"/>
  <text x="660" y="62" text-anchor="middle" font-size="12" fill="#2e7d32">merge</text>

  <path d="M110 82 L170 160" stroke="#b8451f" stroke-width="3"/>
  <path d="M170 160 L600 160" stroke="#b8451f" stroke-width="3"/>
  <path d="M600 160 L660 82" stroke="#b8451f" stroke-width="3"/>
  <circle cx="170" cy="160" r="9" fill="#b8451f"/>
  <circle cx="300" cy="160" r="9" fill="#b8451f"/>
  <circle cx="440" cy="160" r="9" fill="#b8451f"/>
  <circle cx="600" cy="160" r="9" fill="#b8451f"/>
  <text x="24" y="166" font-size="13" font-weight="700" fill="#b8451f">rama</text>
  <text x="385" y="198" text-anchor="middle" font-size="12" fill="#7c2f16">01-powerup-triple-shot</text>

  <rect x="24" y="224" width="140" height="110" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="94" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">1. Crear</text>
  <text x="94" y="274" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#4d2011">git switch -c</text>
  <text x="94" y="292" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#4d2011">rama</text>
  <text x="94" y="318" text-anchor="middle" font-size="11" fill="#7c2f16">Antes de pedir nada</text>

  <rect x="176" y="224" width="140" height="110" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="246" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">2. Planificar</text>
  <text x="246" y="274" text-anchor="middle" font-size="12" fill="#4d2011">Modo plan y</text>
  <text x="246" y="292" text-anchor="middle" font-size="12" fill="#4d2011">petición detallada</text>
  <text x="246" y="318" text-anchor="middle" font-size="11" fill="#7c2f16">Ajusta el plan</text>

  <rect x="328" y="224" width="140" height="110" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="398" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">3. Implementar</text>
  <text x="398" y="274" text-anchor="middle" font-size="12" fill="#4d2011">Aprueba el plan y</text>
  <text x="398" y="292" text-anchor="middle" font-size="12" fill="#4d2011">revisa los cambios</text>
  <text x="398" y="318" text-anchor="middle" font-size="11" fill="#7c2f16">Pruébalo en el navegador</text>

  <rect x="480" y="224" width="140" height="110" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="550" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">4. Commit</text>
  <text x="550" y="274" text-anchor="middle" font-size="12" fill="#4d2011">Lee el mensaje antes</text>
  <text x="550" y="292" text-anchor="middle" font-size="12" fill="#4d2011">de confirmarlo</text>
  <text x="550" y="318" text-anchor="middle" font-size="11" fill="#7c2f16">Solo si funciona</text>

  <rect x="632" y="224" width="144" height="110" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="704" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">5. Fusionar</text>
  <text x="704" y="274" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#4d2011">git switch main</text>
  <text x="704" y="292" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#4d2011">git merge rama</text>
  <text x="704" y="318" text-anchor="middle" font-size="11" fill="#7c2f16">Luego git branch -d</text>

  <path d="M166 279 L174 279" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M318 279 L326 279" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470 279 L478 279" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M622 279 L630 279" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="356" width="752" height="46" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="400" y="376" text-anchor="middle" font-size="13" fill="#4d2011">Si la rama sale mal, la descartas y main sigue intacta. Es tu punto de control permanente,</text>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#4d2011">más duradero que el rebobinado de la sesión.</text>
</svg>
