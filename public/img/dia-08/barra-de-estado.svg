<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">La barra de estado y el contexto</text>
  <rect x="20" y="56" width="760" height="70" rx="8" fill="#1e1e1e"/>
  <text x="40" y="84" font-size="13" fill="#bdbdbd" font-family="Menlo, Courier, monospace">&gt; Escribe tu mensaje...</text>
  <text x="40" y="112" font-size="13" fill="#e0a070" font-family="Menlo, Courier, monospace">[Sonnet 5.5] 04-tetris  main  contexto: 10%</text>
  <path d="M236 130 L236 154" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="148" font-size="12" fill="#7c2f16">Se ejecuta en tu equipo con cada actualización</text>
  <rect x="20" y="166" width="240" height="150" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="140" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">Generarla</text>
  <text x="140" y="216" text-anchor="middle" font-size="12" fill="#4d2011">/statusline pide a Claude</text>
  <text x="140" y="234" text-anchor="middle" font-size="12" fill="#4d2011">crear el script</text>
  <text x="140" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#b8451f">Gasta tokens una vez</text>
  <text x="140" y="290" text-anchor="middle" font-size="11" fill="#7c2f16">Escribe en ~/.claude/</text>
  <rect x="280" y="166" width="240" height="150" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Usarla</text>
  <text x="400" y="216" text-anchor="middle" font-size="12" fill="#4d2011">El script corre local</text>
  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#4d2011">y lee datos de la sesión</text>
  <text x="400" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">No consume tokens de API</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#7c2f16">Campo statusLine en settings.json</text>
  <rect x="540" y="166" width="240" height="150" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="660" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2f16">Qué vigilar</text>
  <text x="660" y="216" text-anchor="middle" font-size="12" fill="#4d2011">El porcentaje de contexto.</text>
  <text x="660" y="236" text-anchor="middle" font-size="12" fill="#4d2011">Regla práctica: procura no</text>
  <text x="660" y="256" text-anchor="middle" font-size="12" fill="#4d2011">pasar del 60 por ciento</text>
  <text x="660" y="284" text-anchor="middle" font-size="12" fill="#4d2011">y usar /clear entre tareas</text>
</svg>
