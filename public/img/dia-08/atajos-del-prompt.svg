<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="380" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Atajos al escribir en el cuadro de mensaje</text>
  <rect x="20" y="56" width="180" height="150" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="110" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#b8451f" font-family="Menlo, Courier, monospace">/</text>
  <text x="110" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Comandos y skills</text>
  <text x="110" y="144" text-anchor="middle" font-size="12" fill="#4d2011">Al inicio del mensaje</text>
  <text x="110" y="180" text-anchor="middle" font-size="11" fill="#7c2f16" font-family="Menlo, Courier, monospace">/init  /model  /clear</text>
  <rect x="220" y="56" width="180" height="150" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="310" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#b8451f" font-family="Menlo, Courier, monospace">!</text>
  <text x="310" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Modo shell</text>
  <text x="310" y="144" text-anchor="middle" font-size="12" fill="#4d2011">Ejecuta y suma la salida</text>
  <text x="310" y="162" text-anchor="middle" font-size="12" fill="#4d2011">al contexto</text>
  <text x="310" y="188" text-anchor="middle" font-size="11" fill="#7c2f16" font-family="Menlo, Courier, monospace">! git status</text>
  <rect x="420" y="56" width="180" height="150" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="510" y="96" text-anchor="middle" font-size="34" font-weight="700" fill="#b8451f" font-family="Menlo, Courier, monospace">@</text>
  <text x="510" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Archivo o carpeta</text>
  <text x="510" y="144" text-anchor="middle" font-size="12" fill="#4d2011">Autocompleta la ruta</text>
  <text x="510" y="162" text-anchor="middle" font-size="12" fill="#4d2011">y da foco a Claude</text>
  <text x="510" y="188" text-anchor="middle" font-size="11" fill="#7c2f16" font-family="Menlo, Courier, monospace">@game.js</text>
  <rect x="620" y="56" width="160" height="150" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#2e7d32" font-family="Menlo, Courier, monospace">Ctrl+B</text>
  <text x="700" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Segundo plano</text>
  <text x="700" y="144" text-anchor="middle" font-size="12" fill="#4d2011">Libera el cuadro de</text>
  <text x="700" y="162" text-anchor="middle" font-size="12" fill="#4d2011">mensaje mientras corre</text>
  <text x="700" y="188" text-anchor="middle" font-size="11" fill="#7c2f16">Ver con /tasks</text>
  <rect x="20" y="228" width="760" height="130" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="254" font-size="13" font-weight="700" fill="#7c2f16">Cuidado con los atajos antiguos</text>
  <text x="40" y="278" font-size="12" fill="#4d2011">• Escribir # al inicio para guardar una nota en la memoria ya no aparece en la lista de atajos actuales.</text>
  <text x="40" y="298" font-size="12" fill="#4d2011">  Pide a Claude "recuerda que..." o abre la memoria con /memory.</text>
  <text x="40" y="320" font-size="12" fill="#4d2011">• Un símbolo &amp; al inicio para mandar a segundo plano tampoco figura. Usa /background (alias /bg) o Ctrl+B.</text>
  <text x="40" y="344" font-size="12" fill="#4d2011">• La salida de ! entra en el contexto y cuesta tokens. Un servidor de desarrollo conviene dejarlo en otra terminal.</text>
</svg>
