<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Dónde vive CLAUDE.md</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#7c2f16">Se cargan de lo más general a lo más específico</text>

  <rect x="24" y="72" width="520" height="68" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="44" y="98" font-size="14" font-weight="700" fill="#b8451f">1. Política gestionada</text>
  <text x="44" y="120" font-size="12" fill="#4d2011">Instrucciones de la organización. Las define TI, afectan a todos los usuarios.</text>

  <rect x="24" y="150" width="520" height="68" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="44" y="176" font-size="14" font-weight="700" fill="#b8451f">2. Usuario: ~/.claude/CLAUDE.md</text>
  <text x="44" y="198" font-size="12" fill="#4d2011">Tus preferencias para todos tus proyectos. Mantenlo muy corto.</text>

  <rect x="24" y="228" width="520" height="68" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="44" y="254" font-size="14" font-weight="700" fill="#b8451f">3. Proyecto: ./CLAUDE.md o ./.claude/CLAUDE.md</text>
  <text x="44" y="276" font-size="12" fill="#4d2011">Arquitectura y reglas del proyecto. Se comparte con el equipo por control de versiones.</text>

  <rect x="24" y="306" width="520" height="68" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="44" y="332" font-size="14" font-weight="700" fill="#2e7d32">4. Local: ./CLAUDE.local.md</text>
  <text x="44" y="354" font-size="12" fill="#4d2011">Preferencias privadas del proyecto. Añádelo a .gitignore.</text>

  <path d="M566 108 L566 340" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="214" font-size="12" font-weight="700" fill="#7c2f16">más específico</text>
  <text x="580" y="230" font-size="12" fill="#7c2f16">aparece después</text>
  <text x="580" y="246" font-size="12" fill="#7c2f16">en el contexto</text>

  <rect x="24" y="386" width="752" height="28" rx="8" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" font-size="12" fill="#4d2011">Para instrucciones por tema o por carpeta existe además .claude/rules/. Se estudia más adelante.</text>
</svg>
