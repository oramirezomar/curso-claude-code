<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#fdf4ef"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Qué debe estar listo antes de empezar</text>

  <rect x="24" y="64" width="128" height="124" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="88" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">1. Cuenta</text>
  <text x="88" y="116" text-anchor="middle" font-size="12" fill="#4d2011">Claude de pago</text>
  <text x="88" y="134" text-anchor="middle" font-size="12" fill="#4d2011">o cuenta de</text>
  <text x="88" y="152" text-anchor="middle" font-size="12" fill="#4d2011">Console</text>
  <text x="88" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3a1a">Obligatorio</text>

  <rect x="180" y="64" width="128" height="124" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="244" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">2. Terminal</text>
  <text x="244" y="116" text-anchor="middle" font-size="12" fill="#4d2011">Cualquiera que</text>
  <text x="244" y="134" text-anchor="middle" font-size="12" fill="#4d2011">ya tengas: Terminal,</text>
  <text x="244" y="152" text-anchor="middle" font-size="12" fill="#4d2011">PowerShell o Warp</text>
  <text x="244" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3a1a">Obligatorio</text>

  <rect x="336" y="64" width="128" height="124" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">3. Node.js y npm</text>
  <text x="400" y="116" text-anchor="middle" font-size="12" fill="#4d2011">Versión LTS actual</text>
  <text x="400" y="134" text-anchor="middle" font-size="12" fill="#4d2011">(24 o 26 en</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#4d2011">noviembre 2026)</text>
  <text x="400" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3a1a">Para el curso</text>

  <rect x="492" y="64" width="128" height="124" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="556" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">4. Git</text>
  <text x="556" y="116" text-anchor="middle" font-size="12" fill="#4d2011">Comprobar con</text>
  <text x="556" y="136" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">git --version</text>
  <text x="556" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3a1a">Para el curso</text>

  <rect x="648" y="64" width="128" height="124" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="712" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b8451f">5. GitHub y gh</text>
  <text x="712" y="116" text-anchor="middle" font-size="12" fill="#4d2011">Cuenta y CLI</text>
  <text x="712" y="134" text-anchor="middle" font-size="12" fill="#4d2011">autenticada con</text>
  <text x="712" y="154" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">gh auth login</text>
  <text x="712" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3a1a">Recomendado</text>

  <path d="M154 126 L176 126" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M310 126 L332 126" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M466 126 L488 126" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M622 126 L644 126" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="218" width="752" height="86" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="244" font-size="13" font-weight="700" fill="#7c2f16">Opcional</text>
  <text x="44" y="268" font-size="13" fill="#4d2011">Editor con la extensión de Claude Code (VS Code o Cursor) · Claude Desktop · Extensión Tailwind CSS IntelliSense</text>
  <text x="44" y="288" font-size="13" fill="#4d2011">Herramienta de dictado para prompts largos · Guía de buenas prácticas para escribir prompts</text>
</svg>
