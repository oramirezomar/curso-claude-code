<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Shift+Tab recorre los modos de permiso</text>

  <rect x="24" y="64" width="220" height="130" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="134" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#b8451f">Manual (default)</text>
  <text x="134" y="120" text-anchor="middle" font-size="12" fill="#4d2011">Pregunta antes de editar</text>
  <text x="134" y="138" text-anchor="middle" font-size="12" fill="#4d2011">archivos, ejecutar comandos</text>
  <text x="134" y="156" text-anchor="middle" font-size="12" fill="#4d2011">o salir a la red</text>
  <text x="134" y="180" text-anchor="middle" font-size="11" fill="#7c2f16">Máximo control</text>

  <rect x="290" y="64" width="220" height="130" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#b8451f">Accept edits</text>
  <text x="400" y="120" text-anchor="middle" font-size="12" fill="#4d2011">Edita archivos sin preguntar</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#4d2011">y usa comandos comunes de</text>
  <text x="400" y="156" text-anchor="middle" font-size="12" fill="#4d2011">archivos. El resto sigue</text>
  <text x="400" y="172" text-anchor="middle" font-size="12" fill="#4d2011">pidiendo permiso</text>

  <rect x="556" y="64" width="220" height="130" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="666" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Plan</text>
  <text x="666" y="120" text-anchor="middle" font-size="12" fill="#4d2011">Solo lee y propone un plan</text>
  <text x="666" y="138" text-anchor="middle" font-size="12" fill="#4d2011">No modifica nada hasta que</text>
  <text x="666" y="156" text-anchor="middle" font-size="12" fill="#4d2011">lo apruebes</text>
  <text x="666" y="180" text-anchor="middle" font-size="11" fill="#7c2f16">Ideal antes de tareas pesadas</text>

  <path d="M246 129 L286 129" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M512 129 L552 129" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M666 196 L666 226 L134 226 L134 198" fill="none" stroke="#7c2f16" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="270" y="212" width="260" height="28" rx="6" fill="#fdf4ef"/>
  <text x="400" y="231" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2f16">y vuelve a empezar el ciclo</text>

  <rect x="24" y="262" width="752" height="62" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="286" font-size="13" font-weight="700" fill="#7c2f16">Modos opcionales</text>
  <text x="44" y="306" font-size="13" fill="#4d2011">Después de Plan pueden aparecer el modo automático y el que omite permisos, según tu versión y tu cuenta.</text>
</svg>
