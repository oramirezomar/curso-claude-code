<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">/rewind vuelve al punto anterior a un mensaje</text>

  <text x="24" y="66" font-size="13" font-weight="700" fill="#7c2f16">Historial de mensajes y estado del código</text>
  <rect x="24" y="78" width="330" height="40" rx="6" fill="#ffffff" stroke="#b8451f"/>
  <text x="40" y="103" font-size="13" fill="#4d2011">1. Fondo rosado claro</text>
  <text x="338" y="103" text-anchor="end" font-size="12" fill="#7c2f16">código: rosado</text>
  <rect x="24" y="126" width="330" height="40" rx="6" fill="#ffffff" stroke="#b8451f"/>
  <text x="40" y="151" font-size="13" fill="#4d2011">2. Fondo morado oscuro</text>
  <text x="338" y="151" text-anchor="end" font-size="12" fill="#7c2f16">código: morado</text>
  <rect x="24" y="174" width="330" height="40" rx="6" fill="#fae4d8" stroke="#b8451f" stroke-width="2.5"/>
  <text x="40" y="199" font-size="13" font-weight="700" fill="#4d2011">3. Fondo gris oscuro (elegido)</text>
  <text x="338" y="199" text-anchor="end" font-size="12" fill="#7c2f16">código: gris</text>
  <rect x="24" y="222" width="330" height="40" rx="6" fill="#ffffff" stroke="#b8451f" stroke-dasharray="5 4"/>
  <text x="40" y="247" font-size="13" fill="#7c2f16">4. Fondo negro (se perderá)</text>
  <text x="338" y="247" text-anchor="end" font-size="12" fill="#7c2f16">código: negro</text>

  <rect x="400" y="66" width="376" height="196" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="588" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">Qué quieres hacer con el mensaje 3</text>
  <text x="420" y="120" font-size="12" fill="#4d2011">• Restaurar código y conversación</text>
  <text x="420" y="140" font-size="12" fill="#4d2011">• Restaurar solo la conversación</text>
  <text x="420" y="160" font-size="12" fill="#4d2011">• Restaurar solo el código</text>
  <text x="420" y="180" font-size="12" fill="#4d2011">• Resumir desde aquí</text>
  <text x="420" y="200" font-size="12" fill="#4d2011">• Resumir hasta aquí</text>
  <text x="420" y="220" font-size="12" fill="#4d2011">• Nada (salir sin cambios)</text>
  <text x="588" y="248" text-anchor="middle" font-size="11" fill="#7c2f16">Se abre con /rewind o con Esc dos veces</text>

  <path d="M356 194 L396 194" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="284" width="752" height="116" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="310" font-size="13" font-weight="700" fill="#7c2f16">Resultado de restaurar código y conversación en el mensaje 3</text>
  <text x="44" y="334" font-size="13" fill="#4d2011">El código queda como estaba antes de ese mensaje: fondo morado oscuro.</text>
  <text x="44" y="354" font-size="13" fill="#4d2011">La conversación conserva los mensajes 1 y 2 y el mensaje 3 vuelve al cuadro de texto.</text>
  <text x="44" y="374" font-size="13" fill="#4d2011">Los cambios del mensaje 4 desaparecen. Para conservarlos, usa Git antes de rebobinar.</text>
</svg>
