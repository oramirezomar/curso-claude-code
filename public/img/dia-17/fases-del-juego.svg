<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c2f16"/></marker>
  </defs>
  <rect width="800" height="360" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Las tres fases del juego</text>
  <rect x="300" y="130" width="200" height="80" rx="12" fill="#ffffff" stroke="#b5482a" stroke-width="2.5"/>
  <text x="400" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#b5482a">jugando</text>
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#4d2011">La pelota se mueve</text>
  <path d="M440,130 C440,70 360,70 360,126" fill="none" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="66" text-anchor="middle" font-size="11" fill="#4d2011">Cae y quedan vidas: resta una y reinicia la pelota</text>
  <rect x="30" y="130" width="190" height="80" rx="12" fill="#fae4d8" stroke="#c0392b" stroke-width="2.5"/>
  <text x="125" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">gameover</text>
  <text x="125" y="188" text-anchor="middle" font-size="12" fill="#4d2011">GAME OVER, todo quieto</text>
  <rect x="580" y="130" width="190" height="80" rx="12" fill="#e8f3e8" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="675" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d32">ganaste</text>
  <text x="675" y="188" text-anchor="middle" font-size="12" fill="#4d2011">¡GANASTE!, todo quieto</text>
  <line x1="300" y1="160" x2="224" y2="160" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="150" text-anchor="middle" font-size="11" fill="#4d2011">0 vidas</text>
  <line x1="500" y1="160" x2="576" y2="160" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <text x="538" y="150" text-anchor="middle" font-size="11" fill="#4d2011">0 bloques</text>
  <path d="M125,214 C125,290 330,290 360,214" fill="none" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <path d="M675,214 C675,290 470,290 440,214" fill="none" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2f16">Enter: juego nuevo, con 3 vidas y 60 bloques</text>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#4d2011">Fuera de la fase jugando, la función paso no cambia nada: por eso la pelota no se mueve.</text>
</svg>
