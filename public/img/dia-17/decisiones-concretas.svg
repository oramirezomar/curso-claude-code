<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Responder a la entrevista con decisiones</text>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#7c2f16">Claude pregunta</text>
  <text x="270" y="68" font-size="13" font-weight="700" fill="#c0392b">Respuesta vaga</text>
  <text x="530" y="68" font-size="13" font-weight="700" fill="#2e7d32">Decisión concreta</text>
  <rect x="20" y="80" width="760" height="62" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="106" font-size="12" fill="#4d2011">¿Cuántos niveles?</text>
  <text x="270" y="106" font-size="12" fill="#4d2011">Quizá varios, ya veremos.</text>
  <text x="530" y="106" font-size="12" fill="#4d2011">Un único nivel.</text>
  <text x="40" y="126" font-size="11" fill="#7c2f16">Alcance</text>
  <rect x="20" y="152" width="760" height="62" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="178" font-size="12" fill="#4d2011">¿Qué tamaño tiene el tablero?</text>
  <text x="270" y="178" font-size="12" fill="#4d2011">Algo grande, que se vea bien.</text>
  <text x="530" y="178" font-size="12" fill="#4d2011">800 por 600, con 10 columnas</text>
  <text x="530" y="194" font-size="12" fill="#4d2011">y 6 filas de bloques.</text>
  <text x="40" y="198" font-size="11" fill="#7c2f16">Diseño</text>
  <rect x="20" y="224" width="760" height="62" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="250" font-size="12" fill="#4d2011">¿Hay sonido y explosiones?</text>
  <text x="270" y="250" font-size="12" fill="#4d2011">Sería bueno añadirlos.</text>
  <text x="530" y="250" font-size="12" fill="#4d2011">No en este spec. Se hará</text>
  <text x="530" y="266" font-size="12" fill="#4d2011">en otro.</text>
  <text x="40" y="270" font-size="11" fill="#7c2f16">Lo que no entra</text>
  <rect x="20" y="296" width="760" height="62" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="322" font-size="12" fill="#4d2011">¿Cómo rebota la pelota?</text>
  <text x="270" y="322" font-size="12" fill="#4d2011">Lo más realista posible.</text>
  <text x="530" y="322" font-size="12" fill="#4d2011">Rebote simple, que invierte</text>
  <text x="530" y="338" font-size="12" fill="#4d2011">la velocidad.</text>
  <text x="40" y="342" font-size="11" fill="#7c2f16">Física</text>
  <text x="400" y="384" text-anchor="middle" font-size="12" fill="#7c2f16">Lo vago lo resuelve Claude por su cuenta. Lo concreto queda escrito en el spec.</text>
</svg>
