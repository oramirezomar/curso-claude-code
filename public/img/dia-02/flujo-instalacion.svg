<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#fdf4ef"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">De cero a la primera consulta</text>

  <rect x="24" y="64" width="172" height="164" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="110" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">1. Instalar</text>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="#4d2011">Instalador nativo</text>
  <text x="110" y="136" text-anchor="middle" font-size="12" fill="#4d2011">para tu sistema</text>
  <text x="110" y="164" text-anchor="middle" font-size="11" fill="#7c2f16">macOS, Linux y WSL:</text>
  <text x="110" y="180" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#4d2011">curl ... | bash</text>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#7c2f16">Windows: irm ... | iex</text>

  <rect x="214" y="64" width="172" height="164" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="300" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">2. Comprobar</text>
  <text x="300" y="124" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">claude --version</text>
  <text x="300" y="150" text-anchor="middle" font-size="12" fill="#4d2011">Debe imprimir un número</text>
  <text x="300" y="168" text-anchor="middle" font-size="12" fill="#4d2011">y (Claude Code)</text>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#7c2f16">Si no responde: terminal nueva</text>

  <rect x="404" y="64" width="172" height="164" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="490" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">3. Autenticar</text>
  <text x="490" y="124" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">claude auth login</text>
  <text x="490" y="150" text-anchor="middle" font-size="12" fill="#4d2011">Se abre el navegador:</text>
  <text x="490" y="168" text-anchor="middle" font-size="12" fill="#4d2011">lee y autoriza</text>
  <text x="490" y="208" text-anchor="middle" font-size="11" fill="#7c2f16">Requiere cuenta de pago</text>

  <rect x="594" y="64" width="182" height="164" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="685" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">4. Empezar</text>
  <text x="685" y="118" text-anchor="middle" font-size="12" fill="#4d2011">Entra a la carpeta</text>
  <text x="685" y="136" text-anchor="middle" font-size="12" fill="#4d2011">de tu proyecto</text>
  <text x="685" y="164" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">cd 01-first-code</text>
  <text x="685" y="184" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">claude</text>
  <text x="685" y="212" text-anchor="middle" font-size="11" fill="#7c2f16">Escribe: ping</text>

  <path d="M198 139 L210 139" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M388 139 L400 139" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M578 139 L590 139" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="248" width="752" height="62" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="274" font-size="13" font-weight="700" fill="#7c2f16">Por qué el instalador nativo</text>
  <text x="44" y="294" font-size="13" fill="#4d2011">Se actualiza solo en segundo plano. Homebrew y WinGet funcionan, pero hay que actualizar a mano.</text>
</svg>
