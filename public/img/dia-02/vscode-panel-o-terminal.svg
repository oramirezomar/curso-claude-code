<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="396" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Tres formas de usarlo dentro de VS Code</text>

  <rect x="24" y="56" width="240" height="210" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="144" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">Panel gráfico</text>
  <text x="144" y="104" text-anchor="middle" font-size="11" fill="#7c2f16">Es el modo predeterminado</text>
  <rect x="44" y="120" width="200" height="82" rx="6" fill="#fae4d8" stroke="#ec9f7a"/>
  <text x="144" y="146" text-anchor="middle" font-size="12" fill="#4d2011">Chat con diffs,</text>
  <text x="144" y="164" text-anchor="middle" font-size="12" fill="#4d2011">revisión de planes</text>
  <text x="144" y="182" text-anchor="middle" font-size="12" fill="#4d2011">y menciones de archivos</text>
  <text x="144" y="232" text-anchor="middle" font-size="12" fill="#4d2011">Subconjunto de comandos</text>
  <text x="144" y="250" text-anchor="middle" font-size="12" fill="#4d2011">Sin atajo ! ni tabulador</text>

  <rect x="280" y="56" width="240" height="210" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">Ajuste Use Terminal</text>
  <text x="400" y="104" text-anchor="middle" font-size="11" fill="#7c2f16">Extensions, Claude Code</text>
  <rect x="300" y="120" width="200" height="82" rx="6" fill="#0d1117"/>
  <text x="312" y="146" font-size="12" font-family="Menlo, Consolas, monospace" fill="#e6edf3">$ claude</text>
  <text x="312" y="166" font-size="12" font-family="Menlo, Consolas, monospace" fill="#8b949e">&gt; el icono abre la CLI</text>
  <text x="312" y="186" font-size="12" font-family="Menlo, Consolas, monospace" fill="#8b949e">&gt; varias instancias</text>
  <text x="400" y="232" text-anchor="middle" font-size="12" fill="#4d2011">El mismo icono Spark</text>
  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#4d2011">lanza la terminal</text>

  <rect x="536" y="56" width="240" height="210" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="656" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">Terminal integrada</text>
  <text x="656" y="104" text-anchor="middle" font-size="11" fill="#7c2f16">Cmd+` en Mac, Ctrl+` en Windows y Linux</text>
  <rect x="556" y="120" width="200" height="82" rx="6" fill="#0d1117"/>
  <text x="568" y="146" font-size="12" font-family="Menlo, Consolas, monospace" fill="#e6edf3">$ claude</text>
  <text x="568" y="166" font-size="12" font-family="Menlo, Consolas, monospace" fill="#8b949e">&gt; /ide</text>
  <text x="568" y="186" font-size="12" font-family="Menlo, Consolas, monospace" fill="#8b949e">&gt; 2 líneas seleccionadas</text>
  <text x="656" y="232" text-anchor="middle" font-size="12" fill="#4d2011">Necesita la CLI instalada</text>
  <text x="656" y="250" text-anchor="middle" font-size="12" fill="#4d2011">por separado</text>

  <rect x="24" y="288" width="752" height="86" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="314" font-size="13" font-weight="700" fill="#7c2f16">Qué comparten</text>
  <text x="44" y="334" font-size="13" fill="#4d2011">Misma cuenta y mismo historial de conversaciones: se retoma con claude --resume.</text>
  <text x="44" y="352" font-size="13" fill="#4d2011">La extensión no agrega el comando claude al PATH de tu terminal.</text>
</svg>
