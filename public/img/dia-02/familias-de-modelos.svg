<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="390" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Tres familias, tres costos (noviembre 2026)</text>

  <rect x="24" y="52" width="240" height="190" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="144" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#b8451f">Opus 5.5</text>
  <text x="144" y="100" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7c2f16">alias: opus</text>
  <text x="144" y="128" text-anchor="middle" font-size="12" fill="#4d2011">Razonamiento complejo</text>
  <text x="144" y="146" text-anchor="middle" font-size="12" fill="#4d2011">y tareas pesadas</text>
  <text x="144" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Entrada 4 USD</text>
  <text x="144" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Salida 20 USD</text>
  <text x="144" y="226" text-anchor="middle" font-size="11" fill="#7c2f16">por millón de tokens</text>

  <rect x="280" y="52" width="240" height="190" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#b8451f">Sonnet 5.5</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7c2f16">alias: sonnet</text>
  <text x="400" y="128" text-anchor="middle" font-size="12" fill="#4d2011">Equilibrio entre calidad</text>
  <text x="400" y="146" text-anchor="middle" font-size="12" fill="#4d2011">y precio, uso diario</text>
  <text x="400" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Entrada 2 USD</text>
  <text x="400" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Salida 10 USD</text>
  <text x="400" y="226" text-anchor="middle" font-size="11" fill="#7c2f16">por millón de tokens</text>

  <rect x="536" y="52" width="240" height="190" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="656" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#b8451f">Haiku 5.5</text>
  <text x="656" y="100" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7c2f16">alias: haiku</text>
  <text x="656" y="128" text-anchor="middle" font-size="12" fill="#4d2011">Rápido y barato,</text>
  <text x="656" y="146" text-anchor="middle" font-size="12" fill="#4d2011">tareas sencillas</text>
  <text x="656" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Entrada 0,10 USD</text>
  <text x="656" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#4d2011">Salida 0,50 USD</text>
  <text x="656" y="226" text-anchor="middle" font-size="11" fill="#7c2f16">hasta 100 000 tokens de prompt</text>

  <rect x="24" y="268" width="752" height="104" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="294" font-size="14" font-weight="700" fill="#7c2f16">Modo híbrido: opusplan</text>
  <rect x="44" y="310" width="170" height="40" rx="8" fill="#ffffff" stroke="#b8451f"/>
  <text x="129" y="335" text-anchor="middle" font-size="13" fill="#4d2011">Modo plan: Opus</text>
  <path d="M216 330 L286 330" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="310" width="190" height="40" rx="8" fill="#ffffff" stroke="#b8451f"/>
  <text x="385" y="335" text-anchor="middle" font-size="13" fill="#4d2011">Ejecución: Sonnet</text>
  <text x="500" y="328" font-size="12" fill="#4d2011">Razona con el modelo caro solo al planificar</text>
  <text x="500" y="346" font-size="12" fill="#4d2011">y ejecuta con el equilibrado.</text>
</svg>
