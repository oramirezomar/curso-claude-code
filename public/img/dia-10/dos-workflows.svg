<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="390" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Los dos workflows que se instalan</text>
  <rect x="20" y="56" width="370" height="226" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="40" y="84" font-size="14" font-weight="700" fill="#b8451f" font-family="Menlo, Courier, monospace">claude.yml</text>
  <text x="40" y="106" font-size="12" fill="#4d2011">Responde cuando alguien menciona a Claude</text>
  <text x="40" y="136" font-size="12" font-weight="700" fill="#7c2f16">Se dispara con @claude en:</text>
  <text x="40" y="158" font-size="12" fill="#4d2011">• un comentario de un issue o pull request</text>
  <text x="40" y="178" font-size="12" fill="#4d2011">• un comentario de revisión de código</text>
  <text x="40" y="198" font-size="12" fill="#4d2011">• una revisión de pull request</text>
  <text x="40" y="218" font-size="12" fill="#4d2011">• el título o el cuerpo de un issue nuevo</text>
  <text x="40" y="248" font-size="12" font-weight="700" fill="#b8451f">Hace: responder, implementar, abrir ramas</text>
  <text x="40" y="268" font-size="11" fill="#7c2f16">Modo interactivo: no lleva prompt fijo</text>
  <rect x="410" y="56" width="370" height="226" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="84" font-size="14" font-weight="700" fill="#2e7d32" font-family="Menlo, Courier, monospace">claude-code-review.yml</text>
  <text x="430" y="106" font-size="12" fill="#4d2011">Revisa cada pull request sin que lo pidas</text>
  <text x="430" y="136" font-size="12" font-weight="700" fill="#2e7d32">Se dispara al:</text>
  <text x="430" y="158" font-size="12" fill="#4d2011">• abrir un pull request</text>
  <text x="430" y="178" font-size="12" fill="#4d2011">• actualizarlo con nuevos commits</text>
  <text x="430" y="198" font-size="12" fill="#4d2011">• reabrirlo o marcarlo como listo</text>
  <text x="430" y="228" font-size="12" font-weight="700" fill="#2e7d32">Hace: comentar los problemas que encuentra</text>
  <text x="430" y="248" font-size="11" fill="#7c2f16">Omite borradores y pull requests triviales</text>
  <text x="430" y="268" font-size="11" fill="#7c2f16">Modo automático: lleva un prompt</text>
  <rect x="20" y="298" width="760" height="76" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="320" font-size="13" font-weight="700" fill="#7c2f16">Quién puede dispararlos</text>
  <text x="40" y="344" font-size="12" fill="#4d2011">Solo quien tenga permiso de escritura en el repositorio. Los bots no, salvo que los autorices.</text>
  <text x="40" y="360" font-size="12" fill="#4d2011">Cada ejecución usa tu suscripción y minutos de Actions.</text>
</svg>
