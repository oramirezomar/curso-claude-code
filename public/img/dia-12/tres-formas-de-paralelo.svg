<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="380" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Tres maneras de trabajar en paralelo</text>
  <rect x="20" y="56" width="240" height="250" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="140" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#b8451f" font-family="Menlo, Courier, monospace">/batch</text>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#4d2011">Automático</text>
  <text x="40" y="136" font-size="12" fill="#4d2011">Automatización</text>
  <rect x="40" y="144" width="200" height="10" rx="5" fill="#eadbd2"/>
  <rect x="40" y="144" width="190" height="10" rx="5" fill="#b8451f"/>
  <text x="40" y="180" font-size="12" fill="#4d2011">Control</text>
  <rect x="40" y="188" width="200" height="10" rx="5" fill="#eadbd2"/>
  <rect x="40" y="188" width="60" height="10" rx="5" fill="#2e7d32"/>
  <text x="140" y="230" text-anchor="middle" font-size="12" fill="#4d2011">Lo hace todo: worktrees,</text>
  <text x="140" y="248" text-anchor="middle" font-size="12" fill="#4d2011">commits y pull requests</text>
  <text x="140" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#b8451f">Este día</text>
  <rect x="280" y="56" width="240" height="250" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="400" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#b8451f" font-family="Menlo, Courier, monospace">git worktree</text>
  <text x="400" y="106" text-anchor="middle" font-size="12" fill="#4d2011">Manual</text>
  <text x="300" y="136" font-size="12" fill="#4d2011">Automatización</text>
  <rect x="300" y="144" width="200" height="10" rx="5" fill="#eadbd2"/>
  <rect x="300" y="144" width="30" height="10" rx="5" fill="#b8451f"/>
  <text x="300" y="180" font-size="12" fill="#4d2011">Control</text>
  <rect x="300" y="188" width="200" height="10" rx="5" fill="#eadbd2"/>
  <rect x="300" y="188" width="190" height="10" rx="5" fill="#2e7d32"/>
  <text x="400" y="230" text-anchor="middle" font-size="12" fill="#4d2011">Tú creas cada carpeta</text>
  <text x="400" y="248" text-anchor="middle" font-size="12" fill="#4d2011">y lanzas cada Claude</text>
  <text x="400" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#b8451f">Día 13</text>
  <rect x="540" y="56" width="240" height="250" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="660" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Comando propio</text>
  <text x="660" y="106" text-anchor="middle" font-size="12" fill="#4d2011">Semiautomático</text>
  <text x="560" y="136" font-size="12" fill="#4d2011">Automatización</text>
  <rect x="560" y="144" width="200" height="10" rx="5" fill="#eadbd2"/>
  <rect x="560" y="144" width="110" height="10" rx="5" fill="#b8451f"/>
  <text x="560" y="180" font-size="12" fill="#4d2011">Control</text>
  <rect x="560" y="188" width="200" height="10" rx="5" fill="#eadbd2"/>
  <rect x="560" y="188" width="120" height="10" rx="5" fill="#2e7d32"/>
  <text x="660" y="230" text-anchor="middle" font-size="12" fill="#4d2011">Un comando crea la rama y</text>
  <text x="660" y="248" text-anchor="middle" font-size="12" fill="#4d2011">el worktree, tú decides el resto</text>
  <text x="660" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">Día 13</text>
  <rect x="20" y="324" width="760" height="40" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="349" font-size="12" fill="#4d2011">No hay una mejor opción: depende de cuánto control necesites. Las barras son una guía, no una medida.</text>
</svg>
