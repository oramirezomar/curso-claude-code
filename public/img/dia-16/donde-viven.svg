<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Dónde viven los skills</text>
  <rect x="20" y="56" width="470" height="62" rx="10" fill="#ffffff" stroke="#b5482a" stroke-width="2"/>
  <text x="36" y="80" font-size="14" font-weight="700" fill="#b5482a">1. Empresa</text>
  <text x="36" y="100" font-size="12" fill="#4d2011">Carpeta de ajustes administrados. Aplica a todas las personas.</text>
  <rect x="20" y="130" width="470" height="62" rx="10" fill="#ffffff" stroke="#b5482a" stroke-width="2"/>
  <text x="36" y="154" font-size="14" font-weight="700" fill="#b5482a">2. Personal</text>
  <text x="152" y="154" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">~/.claude/skills/nombre/</text>
  <text x="36" y="174" font-size="12" fill="#4d2011">Todos tus proyectos en este equipo.</text>
  <rect x="20" y="204" width="470" height="62" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="36" y="228" font-size="14" font-weight="700" fill="#2e7d32">3. Proyecto</text>
  <text x="152" y="228" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">.claude/skills/nombre/</text>
  <text x="36" y="248" font-size="12" fill="#4d2011">Solo este repositorio. Se versiona con Git y lo recibe todo el equipo.</text>
  <rect x="20" y="278" width="470" height="62" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="2"/>
  <text x="36" y="302" font-size="14" font-weight="700" fill="#7c2f16">Plugin</text>
  <text x="152" y="302" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">/plugin:nombre</text>
  <text x="36" y="322" font-size="12" fill="#4d2011">Lleva el nombre del plugin delante, así que no choca con los demás.</text>
  <rect x="510" y="56" width="270" height="284" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="530" y="82" font-size="14" font-weight="700" fill="#7c2f16">Si hay dos con el mismo nombre</text>
  <text x="530" y="112" font-size="12" fill="#4d2011">Gana el nivel más alto:</text>
  <text x="530" y="134" font-size="12" fill="#4d2011">empresa, luego personal,</text>
  <text x="530" y="152" font-size="12" fill="#4d2011">luego proyecto.</text>
  <text x="530" y="188" font-size="12" fill="#4d2011">Un skill de proyecto puede</text>
  <text x="530" y="206" font-size="12" fill="#4d2011">quedar tapado por uno tuyo</text>
  <text x="530" y="224" font-size="12" fill="#4d2011">con el mismo nombre.</text>
  <text x="530" y="260" font-size="12" fill="#7c2f16">Elige nombres específicos</text>
  <text x="530" y="278" font-size="12" fill="#7c2f16">para tu equipo, como</text>
  <text x="530" y="296" font-size="12" fill="#7c2f16">spec-impl y no impl.</text>
  <rect x="20" y="354" width="760" height="36" rx="10" fill="#ffffff" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="400" y="377" text-anchor="middle" font-size="12" fill="#4d2011">Para un curso o un equipo, empieza por el nivel de proyecto: viaja con el repositorio.</text>
</svg>
