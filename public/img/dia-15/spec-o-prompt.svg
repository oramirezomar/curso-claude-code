<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">¿Spec o prompt directo?</text>
  <rect x="20" y="56" width="370" height="258" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="205" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Escribe un spec si...</text>
  <text x="40" y="114" font-size="12" fill="#4d2011">• Toca más de dos archivos.</text>
  <text x="40" y="138" font-size="12" fill="#4d2011">• La decisión cuesta revertirla: esquemas,</text>
  <text x="52" y="156" font-size="12" fill="#4d2011">formatos, endpoints.</text>
  <text x="40" y="180" font-size="12" fill="#4d2011">• Lo olvidarás en una semana.</text>
  <text x="40" y="204" font-size="12" fill="#4d2011">• Abarca más de una sesión de trabajo.</text>
  <text x="40" y="228" font-size="12" fill="#4d2011">• Es un contrato con skills, hooks u otros specs.</text>
  <text x="40" y="252" font-size="12" fill="#4d2011">• Te da pereza plantearlo por lo complejo.</text>
  <text x="40" y="284" font-size="11" fill="#7c2f16">Si sueles abrir el modo plan, suele ser un spec.</text>
  <rect x="410" y="56" width="370" height="258" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="595" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#b8451f">Un prompt directo basta si...</text>
  <text x="430" y="114" font-size="12" fill="#4d2011">• Es una corrección puntual.</text>
  <text x="430" y="138" font-size="12" fill="#4d2011">• Es una refactorización mecánica.</text>
  <text x="430" y="162" font-size="12" fill="#4d2011">• Es un experimento exploratorio.</text>
  <text x="430" y="186" font-size="12" fill="#4d2011">• Cabe en un prompt y se entiende a la primera.</text>
  <text x="430" y="210" font-size="12" fill="#4d2011">• Es una tarea única que no se repite.</text>
  <text x="430" y="234" font-size="12" fill="#4d2011">• Planearlo te aburre porque es muy corto.</text>
  <text x="430" y="266" font-size="11" fill="#7c2f16">Si se repite a menudo, piensa en un skill.</text>
  <rect x="20" y="332" width="760" height="52" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="40" y="354" font-size="13" font-weight="700" fill="#7c2f16">Regla de fondo</text>
  <text x="40" y="374" font-size="12" fill="#4d2011">Responderás tú por el código que aceptes. Si es importante, merece un spec, aunque sea pequeño.</text>
</svg>
