<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="380" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Cuatro fotogramas en 240 ms</text>
  <rect x="20" y="56" width="180" height="170" rx="10" fill="#000000"/>
  <rect x="215" y="56" width="180" height="170" rx="10" fill="#000000"/>
  <rect x="410" y="56" width="180" height="170" rx="10" fill="#000000"/>
  <rect x="605" y="56" width="175" height="170" rx="10" fill="#000000"/>
  <rect x="60" y="124.5" width="100" height="33" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="255" y="124.5" width="100" height="33" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="450" y="124.5" width="100" height="33" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="642.5" y="124.5" width="100" height="33" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="52.5" y="122.0" width="115.0" height="37.9" fill="#ef476f" fill-opacity="0.78"/>
  <rect x="240.0" y="119.5" width="130.0" height="42.9" fill="#ef476f" fill-opacity="0.56"/>
  <rect x="427.5" y="117.1" width="145.0" height="47.9" fill="#ef476f" fill-opacity="0.34"/>
  <rect x="612.5" y="114.6" width="160.0" height="52.8" fill="#ef476f" fill-opacity="0.12"/>
  <text x="110" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Fotograma 0</text>
  <text x="305" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Fotograma 1</text>
  <text x="500" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Fotograma 2</text>
  <text x="692" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Fotograma 3</text>
  <text x="110" y="212" text-anchor="middle" font-size="12" fill="#ffffff">0 a 59 ms</text>
  <text x="305" y="212" text-anchor="middle" font-size="12" fill="#ffffff">60 a 119 ms</text>
  <text x="500" y="212" text-anchor="middle" font-size="12" fill="#ffffff">120 a 179 ms</text>
  <text x="692" y="212" text-anchor="middle" font-size="12" fill="#ffffff">180 a 239 ms</text>
  <rect x="20" y="244" width="370" height="120" rx="10" fill="#ffffff" stroke="#b5482a" stroke-width="2"/>
  <text x="36" y="268" font-size="14" font-weight="700" fill="#b5482a">Qué cambia en cada fotograma n</text>
  <text x="36" y="292" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">escala = 1 + 0,15 × (n + 1)</text>
  <text x="36" y="312" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">opacidad = 1 − 0,22 × (n + 1)</text>
  <text x="36" y="338" font-size="12" fill="#4d2011">Crece 15 puntos porcentuales y pierde 22 de opacidad.</text>
  <rect x="410" y="244" width="370" height="120" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="426" y="268" font-size="14" font-weight="700" fill="#7c2f16">De dónde sale el fotograma</text>
  <text x="426" y="292" font-size="12" font-family="Menlo, Consolas, monospace" fill="#4d2011">n = floor(ms / 240 × 4)</text>
  <text x="426" y="316" font-size="12" fill="#4d2011">Con un máximo de 3, para que el</text>
  <text x="426" y="334" font-size="12" fill="#4d2011">último dure hasta eliminarse.</text>
</svg>
