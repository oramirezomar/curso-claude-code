<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="380" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Varias explosiones a la vez</text>
  <line x1="60" y1="270" x2="740" y2="270" stroke="#7c2f16" stroke-width="2"/>
  <text x="60" y="290" text-anchor="middle" font-size="11" fill="#4d2011">0 ms</text>
  <text x="240" y="290" text-anchor="middle" font-size="11" fill="#4d2011">120 ms</text>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#4d2011">240 ms</text>
  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#4d2011">360 ms</text>
  <text x="720" y="290" text-anchor="middle" font-size="11" fill="#4d2011">440 ms</text>
  <text x="20" y="98" font-size="12" font-weight="700" fill="#ef476f">A</text>
  <text x="20" y="138" font-size="12" font-weight="700" fill="#06d6a0">B</text>
  <text x="20" y="178" font-size="12" font-weight="700" fill="#9b5de5">C</text>
  <rect x="60" y="80" width="360" height="26" rx="5" fill="#ef476f" fill-opacity="0.8"/>
  <rect x="210" y="120" width="360" height="26" rx="5" fill="#06d6a0" fill-opacity="0.8"/>
  <rect x="330" y="160" width="360" height="26" rx="5" fill="#9b5de5" fill-opacity="0.8"/>
  <text x="190" y="98" text-anchor="middle" font-size="12" fill="#4d2011">se rompe en 0 ms, dura 240 ms</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#4d2011">se rompe en 100 ms</text>
  <text x="510" y="178" text-anchor="middle" font-size="12" fill="#4d2011">se rompe en 180 ms: era el último bloque</text>
  <line x1="330" y1="66" x2="330" y2="262" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="338" y="62" font-size="12" font-weight="700" fill="#c0392b">fase ganaste</text>
  <text x="60" y="224" font-size="12" font-weight="700" fill="#4d2011">Activas</text>
  <text x="135" y="224" text-anchor="middle" font-size="12" fill="#4d2011">1</text>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#4d2011">2</text>
  <text x="375" y="224" text-anchor="middle" font-size="12" fill="#4d2011">3</text>
  <text x="495" y="224" text-anchor="middle" font-size="12" fill="#4d2011">2</text>
  <text x="630" y="224" text-anchor="middle" font-size="12" fill="#4d2011">1</text>
  <text x="715" y="224" text-anchor="middle" font-size="12" fill="#4d2011">0</text>
  <rect x="20" y="304" width="760" height="62" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="36" y="328" font-size="13" font-weight="700" fill="#7c2f16">La fase cambia, el reloj de las explosiones no</text>
  <text x="36" y="348" font-size="12" fill="#4d2011">Por eso avanzarExplosiones se llama al principio de paso, antes de salir si la fase no es jugando.</text>
</svg>
