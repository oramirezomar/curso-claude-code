<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c2f16"/></marker>
  </defs>
  <rect width="800" height="380" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Pausa y selector de nivel</text>
  <rect x="20" y="56" width="400" height="300" rx="10" fill="#000000" stroke="#9a9a9a" stroke-width="2"/>
  <text x="34" y="78" font-size="11" fill="#ffffff">Puntos: 130</text>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#ffffff">Nivel 2</text>
  <circle cx="380" cy="73" r="4" fill="#ffd166"/>
  <circle cx="394" cy="73" r="4" fill="#ffd166"/>
  <rect x="30" y="92" width="380" height="48" fill="#ef476f" fill-opacity="0.25"/>
  <rect x="20" y="56" width="400" height="300" rx="10" fill="#000000" fill-opacity="0.65"/>
  <text x="220" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">PAUSA</text>
  <text x="220" y="192" text-anchor="middle" font-size="11" fill="#ffffff">Elige un nivel o pulsa P para seguir</text>
  <rect x="102" y="212" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="146" y="212" width="36" height="36" fill="none" stroke="#ffd166" stroke-width="2"/>
  <rect x="190" y="212" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="234" y="212" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="278" y="212" width="36" height="36" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="120" y="237" text-anchor="middle" font-size="16" fill="#ffffff">1</text>
  <text x="164" y="237" text-anchor="middle" font-size="16" fill="#ffffff">2</text>
  <text x="208" y="237" text-anchor="middle" font-size="16" fill="#ffffff">3</text>
  <text x="252" y="237" text-anchor="middle" font-size="16" fill="#ffffff">4</text>
  <text x="296" y="237" text-anchor="middle" font-size="16" fill="#ffffff">5</text>
  <rect x="440" y="56" width="340" height="120" rx="10" fill="#ffffff" stroke="#b5482a" stroke-width="2"/>
  <text x="456" y="80" font-size="14" font-weight="700" fill="#b5482a">Dos fases que se alternan</text>
  <rect x="456" y="96" width="110" height="40" rx="8" fill="#ffffff" stroke="#b5482a" stroke-width="2"/>
  <text x="511" y="121" text-anchor="middle" font-size="13" fill="#4d2011">jugando</text>
  <rect x="650" y="96" width="114" height="40" rx="8" fill="#fae4d8" stroke="#2e7d32" stroke-width="2"/>
  <text x="707" y="121" text-anchor="middle" font-size="13" fill="#4d2011">pausa</text>
  <line x1="566" y1="108" x2="646" y2="108" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="126" x2="570" y2="126" stroke="#7c2f16" stroke-width="2" marker-end="url(#a)"/>
  <text x="606" y="100" text-anchor="middle" font-size="10" fill="#4d2011">P o Esc</text>
  <text x="606" y="146" text-anchor="middle" font-size="10" fill="#4d2011">P o Esc</text>
  <rect x="440" y="190" width="340" height="166" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="456" y="214" font-size="14" font-weight="700" fill="#7c2f16">Qué ocurre en pausa</text>
  <text x="456" y="238" font-size="12" fill="#4d2011">paso no mueve nada: ni la pelota ni</text>
  <text x="456" y="256" font-size="12" fill="#4d2011">las explosiones, que quedan congeladas.</text>
  <text x="456" y="282" font-size="12" fill="#4d2011">Un clic en un botón, o la tecla del 1 al 5,</text>
  <text x="456" y="300" font-size="12" fill="#4d2011">carga ese nivel y vuelve a jugando.</text>
  <text x="456" y="326" font-size="12" fill="#4d2011">Se conservan los puntos y las vidas.</text>
  <text x="456" y="344" font-size="12" fill="#4d2011">El nivel actual aparece resaltado.</text>
</svg>
