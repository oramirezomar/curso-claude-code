<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7c2f16"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#fdf4ef"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d2011">Cambiar de tarea sin perder el hilo</text>

  <rect x="24" y="60" width="164" height="96" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="106" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">Tarea A</text>
  <text x="106" y="112" text-anchor="middle" font-size="12" fill="#4d2011">Conversación larga</text>
  <text x="106" y="130" text-anchor="middle" font-size="12" fill="#4d2011">con mucho contexto</text>

  <rect x="226" y="60" width="164" height="96" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="308" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">/rename</text>
  <text x="308" y="112" text-anchor="middle" font-size="12" fill="#4d2011">Le das un nombre</text>
  <text x="308" y="130" text-anchor="middle" font-size="12" fill="#4d2011">o Claude propone uno</text>

  <rect x="428" y="60" width="164" height="96" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="510" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">/clear</text>
  <text x="510" y="112" text-anchor="middle" font-size="12" fill="#4d2011">Contexto vacío,</text>
  <text x="510" y="130" text-anchor="middle" font-size="12" fill="#4d2011">cuesta cero</text>

  <rect x="630" y="60" width="146" height="96" rx="10" fill="#ffffff" stroke="#b8451f" stroke-width="2"/>
  <text x="703" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#b8451f">Tarea B</text>
  <text x="703" y="112" text-anchor="middle" font-size="12" fill="#4d2011">Empieza con solo</text>
  <text x="703" y="130" text-anchor="middle" font-size="12" fill="#4d2011">la base fija</text>

  <path d="M190 108 L222 108" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M392 108 L424 108" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M594 108 L626 108" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M703 158 L703 200 L106 200 L106 162" fill="none" stroke="#7c2f16" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="270" y="186" width="260" height="28" rx="6" fill="#fdf4ef"/>
  <text x="400" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2f16">claude --resume nombre  o  /resume</text>

  <rect x="24" y="240" width="752" height="78" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="264" font-size="13" font-weight="700" fill="#7c2f16">Y si no quieres perder la conversación</text>
  <text x="44" y="284" font-size="13" fill="#4d2011">/compact resume la conversación y la conserva en la misma sesión. Es una petición grande,</text>
  <text x="44" y="302" font-size="13" fill="#4d2011">y si no le das instrucciones, Claude decide qué guardar.</text>
</svg>
