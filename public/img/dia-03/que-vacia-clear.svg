  <text x="601" y="290" text-anchor="middle" font-size="12" fill="#7c2f16">Por eso conviene mantenerla pequeña</text>

  <path d="M376 181 L424 181" stroke="#7c2f16" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="326" width="752" height="56" rx="10" fill="#fae4d8" stroke="#ec9f7a" stroke-width="1.5"/>
  <text x="44" y="350" font-size="13" font-weight="700" fill="#7c2f16">Regla práctica</text>
  <text x="44" y="370" font-size="13" fill="#4d2011">Pon nombre a la sesión con /rename, límpiala con /clear al cambiar de tarea y vuelve a ella con /resume si la necesitas.</text>
