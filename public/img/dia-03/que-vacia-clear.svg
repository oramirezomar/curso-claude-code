  <rect x="24" y="56" width="350" height="250" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="199" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">Se vacía</text>
