  <text x="199" y="290" text-anchor="middle" font-size="12" fill="#7c2f16">Empezar de cero no cuesta nada</text>

  <rect x="426" y="56" width="350" height="250" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
